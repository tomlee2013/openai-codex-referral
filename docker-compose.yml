version: '3.8'

services:
  codex-referral:
    build: .
    container_name: openai-codex-referral
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - ADMIN_PASSWORD=admin123456
      - ADMIN_PATH=admin-secret-dashboard
      - DEFAULT_ACCOUNT_PASSWORD=ChangeMePassword123!@
      # - WORKER_URL=https://your-worker-email-domain.com
      # - WORKER_ADMIN_AUTH=YourWorkerAdminSecret
      # - WORKER_DOMAIN=your-custom-domain.com
      # - DEFAULT_PROXY=http://user:pass@proxy-ip:port
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
